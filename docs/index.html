<style>
:root{--ink:#1b2a2f;--muted:#5b6b70;--green:#1f6f54;--green2:#2e8b6a;--blue:#2e5496;--sand:#f5f3ec;--line:#dfe3e0;--card:#ffffff;}
*{box-sizing:border-box}
body{margin:0;font-family:Georgia,'Times New Roman',serif;color:var(--ink);background:#fbfaf7;line-height:1.6}

<body>
<header>
 <div class="bar">
  <div><h1 class="sans" data-es="El efecto de la deforestación en la generación hidroeléctrica" data-en="The effect of deforestation on hydroelectric generation"></h1>
  <div class="sub sans" data-es="Colombia · Tesis de Maestría en Economía · J. E. Rojas Sánchez" data-en="Colombia · MSc Economics Thesis · J. E. Rojas Sánchez"></div></div>
  <div class="langtog sans"><button id="bes" class="active" onclick="setLang('es')">ES</button><button id="ben" onclick="setLang('en')">EN</button></div>
 </div>
</header>

<div class="hero">
 <div class="wrap">
  <h2 data-es="¿Cuánto vale el bosque para una hidroeléctrica?" data-en="How much is a forest worth to a hydropower plant?"></h2>
  <p data-es="Un análisis económico y espacial de 60 hidroeléctricas colombianas (2000–2015). El bosque no produce más agua: produce agua de mejor calidad y mejor distribuida en el tiempo. Este visor reúne los datos espaciales, los resultados y el marco conceptual de la tesis." data-en="An economic and spatial analysis of 60 Colombian hydropower plants (2000–2015). Forests do not produce more water: they produce cleaner water, better distributed over time. This viewer brings together the spatial data, the results and the conceptual framework of the thesis."></p>
  <div class="kpis sans">
   <div class="kpi"><b>~65%</b><span data-es="de la electricidad de Colombia es hidráulica" data-en="of Colombia's electricity is hydropower"></span></div>
   <div class="kpi"><b>121</b><span data-es="plantas georreferenciadas en el mapa" data-en="georeferenced plants on the map"></span></div>
   <div class="kpi"><b>2,5%</b><span data-es="pérdida de potencia (filo de agua) por deforestación" data-en="power loss (run-of-river) from deforestation"></span></div>
   <div class="kpi"><b>$3M COP</b><span data-es="beneficio por hectárea conservada / año" data-en="benefit per hectare conserved / year"></span></div>
  </div>
 </div>
</div>

<section><div class="wrap">
 <h3 data-es="Mapa de centrales hidroeléctricas" data-en="Map of hydropower plants"></h3>
 <p class="lead" data-es="Tamaño del círculo ∝ capacidad instalada (MW). Haz clic en una planta para ver sus atributos." data-en="Circle size ∝ installed capacity (MW). Click a plant to see its attributes."></p>
 <div class="maptools sans">
   <button id="f-all" class="active" onclick="filterType('all')" data-es="Todas" data-en="All"></button>
   <button id="f-emb" onclick="filterType('emb')" data-es="Embalse" data-en="Reservoir"></button>
   <button id="f-filo" onclick="filterType('filo')" data-es="Filo de agua" data-en="Run-of-river"></button>
   <button id="f-est" onclick="toggleStudy()" data-es="Mostrar plantas del estudio (45)" data-en="Show study plants (45)"></button>
 </div>
 <div class="grid2" style="grid-template-columns:3fr 1fr">
  <div id="map"></div>
  <div>
    <div class="legend sans">
      <div style="font-weight:700;margin-bottom:6px" data-es="Leyenda" data-en="Legend"></div>
      <div><i style="background:#2e5496"></i><span data-es="Embalse / regulación" data-en="Reservoir / storage"></span></div>
      <div><i style="background:#2e8b6a"></i><span data-es="Filo de agua" data-en="Run-of-river"></span></div>
      <div><i style="background:#e08a1e"></i><span data-es="Planta del estudio (45)" data-en="Study plant (45)"></span></div>
      <hr style="border:0;border-top:1px solid var(--line);margin:8px 0">
      <div id="count" style="color:var(--muted)"></div>
    </div>
    <div class="note sans" style="margin-top:12px" data-es="Pendiente de cargar: cuencas aportantes y deforestación. Sube tus archivos shp/GeoJSON y se integran como capas." data-en="To be added: contributing catchments and deforestation. Upload your shp/GeoJSON and they will be integrated as layers."></div>
  </div>
 </div>
</div></section>

<section><div class="wrap">
 <h3 data-es="Hallazgos clave" data-en="Key findings"></h3>
 <p class="lead" data-es="Resultados econométricos (panel de efectos fijos) y valoración de escenarios de conservación." data-en="Econometric results (fixed-effects panel) and valuation of conservation scenarios."></p>
 <div class="two">
  <div class="card">
   <div class="sans" style="font-weight:700;margin-bottom:4px" data-es="Efecto de la deforestación sobre el factor de potencia" data-en="Effect of deforestation on the power factor"></div>
   <div class="sans" style="font-size:12px;color:var(--muted);margin-bottom:10px" data-es="Coeficientes (Tabla 6). Negativo = la deforestación reduce la generación." data-en="Coefficients (Table 6). Negative = deforestation reduces generation."></div>
   <div class="chartbox"><canvas id="c1"></canvas></div>
  </div>
  <div class="card">
   <div class="sans" style="font-weight:700;margin-bottom:4px" data-es="Escenarios de conservación (plantas a filo de agua)" data-en="Conservation scenarios (run-of-river plants)"></div>
   <div class="sans" style="font-size:12px;color:var(--muted);margin-bottom:10px" data-es="Energía adicional y valor de mercado al reducir la deforestación (Tabla 7)." data-en="Additional energy and market value from reducing deforestation (Table 7)."></div>
   <div class="chartbox"><canvas id="c2"></canvas></div>
  </div>
 </div>
</div></section>

<section><div class="wrap">
 <h3 data-es="Marco conceptual" data-en="Conceptual framework"></h3>
 <p class="lead" data-es="El valor del bosque no está en el volumen de agua, sino en su calidad y su oportunidad." data-en="The value of the forest is not in water volume, but in its quality and timing."></p>
 <div class="grid2">
  <div class="ext"><div class="ic">🪵</div><div>
   <b data-es="1 · Control de erosión y sedimentos" data-en="1 · Erosion and sediment control"></b>
   <div data-es="La hojarasca y las raíces reducen la carga de sedimentos. Menos abrasión en las turbinas (menor costo de O&amp;M) y menor colmatación del embalse, que es la depreciación física de un activo difícil de reponer." data-en="Litter and roots reduce sediment load. Less turbine abrasion (lower O&amp;M cost) and slower reservoir siltation — the physical depreciation of an asset that is hard to replace."></div>
  </div></div>
  <div class="ext"><div class="ic">🌊</div><div>
   <b data-es="2 · Regulación de caudales máximos" data-en="2 · Peak-flow regulation"></b>
   <div data-es="El bosque atenúa los picos de creciente y retrasa los caudales mínimos. Reduce los vertimientos (agua que se pierde sin turbinar) y sostiene la energía firme del sistema." data-en="The forest attenuates flood peaks and delays low flows. It reduces spillage (water lost without turbining) and supports the system's firm energy."></div>
  </div></div>
 </div>
 <div class="note sans" style="margin-top:8px" data-es="Hallazgo central: el efecto es significativo en plantas a filo de agua (sin regulación artificial). En embalses, el beneficio opera por la vía de la sedimentación, a horizontes que el panel 2000–2015 no captura — por eso los resultados son una cota inferior del valor del bosque." data-en="Core finding: the effect is significant for run-of-river plants (no artificial regulation). In reservoirs the benefit operates through siltation, over horizons the 2000–2015 panel does not capture — so the results are a lower bound on the value of the forest."></div>
</div></section>

<section><div class="wrap">
 <h3 data-es="Métodos y datos" data-en="Methods and data"></h3>
 <p class="lead" data-es="Panel de 60 hidroeléctricas, efectos fijos y modelos no paramétricos (spline), 2000–2015." data-en="Panel of 60 hydropower plants, fixed effects and non-parametric (spline) models, 2000–2015."></p>
 <div class="grid2">
  <div class="card sans"><b data-es="Fuentes de datos" data-en="Data sources"></b>
   <ul><li data-es="Deforestación: Hansen et al. (Global Forest Change), píxeles de 208 m" data-en="Deforestation: Hansen et al. (Global Forest Change), 208 m pixels"></li>
   <li data-es="Generación, precio de bolsa y capacidad: XM" data-en="Generation, spot price and capacity: XM"></li>
   <li data-es="Precipitación: IDEAM (interpolación spline)" data-en="Precipitation: IDEAM (spline interpolation)"></li>
   <li data-es="Cuencas: delineación con DEM (USGS); ubicación de plantas UPME/IGAC" data-en="Catchments: DEM delineation (USGS); plant locations UPME/IGAC"></li></ul>
  </div>
  <div class="card sans"><b data-es="Estrategia empírica" data-en="Empirical strategy"></b>
   <ul><li data-es="Variable dependiente: factor de capacidad (potencia/capacidad instalada)" data-en="Dependent variable: capacity factor (output/installed capacity)"></li>
   <li data-es="Efectos fijos de planta y de tiempo; errores agrupados por cuenca" data-en="Plant and time fixed effects; errors clustered by catchment"></li>
   <li data-es="Interacción deforestación × tipo (filo / embalse)" data-en="Deforestation × type interaction (run-of-river / reservoir)"></li>
   <li data-es="Splines (nudos de Harrell) para no linealidad" data-en="Splines (Harrell knots) for non-linearity"></li></ul>
  </div>
 </div>
</div></section>

L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'© OpenStreetMap, © CARTO',maxZoom:18}).addTo(map);
function rad(mw){if(!mw)return 4;return Math.max(4,Math.min(22,Math.sqrt(mw)*0.9));}
function isEmb(p){return (p.tipo||'').indexOf('Embalse')>-1;}
let upLayer=L.layerGroup().addTo(map), estLayer=L.layerGroup(), curFilter='all', studyOn=false;
function popup(p){
 const L_=lang;
 const t=(es,en)=>L_==='es'?es:en;
 let r='<div class="pp"><b>'+(p.nombre||'—')+'</b><br>';
 r+=t('Tipo','Type')+': '+(p.tipo||'—')+'<br>';
 if(p.capacidad_MW)r+=t('Capacidad','Capacity')+': '+p.capacidad_MW+' MW<br>';
 if(p.caudal_max_m3s)r+=t('Caudal máx.','Max flow')+': '+p.caudal_max_m3s+' m³/s<br>';
 if(p.vol_max_Hm3)r+=t('Vol. máx.','Max vol.')+': '+p.vol_max_Hm3+' Hm³<br>';
 if(p.anio)r+=t('Año','Year')+': '+p.anio+'<br>';
 if(p.departamento)r+=p.departamento+(p.municipio?' · '+p.municipio:'')+'<br>';
 if(p.agente)r+='<span style="color:#5b6b70">'+p.agente+'</span>';
 return r+'</div>';
}
function drawUP(){upLayer.clearLayers();let n=0;
 UPME.features.forEach(f=>{const p=f.properties;const emb=isEmb(p);
  if(curFilter==='emb'&&!emb)return; if(curFilter==='filo'&&emb)return;
  const c=f.geometry.coordinates;
  L.circleMarker([c[1],c[0]],{radius:rad(p.capacidad_MW),color:emb?'#2e5496':'#2e8b6a',weight:1,fillColor:emb?'#2e5496':'#2e8b6a',fillOpacity:.6}).bindPopup(popup(p)).addTo(upLayer);n++;});
 window._n=n;renderCount();}
function drawEST(){estLayer.clearLayers();
 EST.features.forEach(f=>{const p=f.properties;const c=f.geometry.coordinates;
  L.circleMarker([c[1],c[0]],{radius:6,color:'#b5660f',weight:1.5,fillColor:'#e08a1e',fillOpacity:.85}).bindPopup('<div class="pp"><b>'+(p.nombre||p.proyecto||'—')+'</b><br>'+(lang==='es'?'Proyecto':'Project')+': '+(p.proyecto||'—')+'</div>').addTo(estLayer);});}
function renderCount(){const el=document.getElementById('count');if(!el)return;
 el.textContent=(lang==='es'?'Mostrando ':'Showing ')+(window._n||0)+(lang==='es'?' plantas':' plants');}
function filterType(t){curFilter=t;['all','emb','filo'].forEach(x=>document.getElementById('f-'+x).classList.toggle('active',x===t));drawUP();}
function toggleStudy(){studyOn=!studyOn;const b=document.getElementById('f-est');b.classList.toggle('active',studyOn);
 if(studyOn){drawEST();estLayer.addTo(map);}else{map.removeLayer(estLayer);}}
drawUP();
// CHARTS
const c1=new Chart(document.getElementById('c1'),{type:'bar',
 data:{labels:['M1 (todas)','M2 (interacción)','M3 (solo filo)','M4 (filo, s/precio)'],
  datasets:[{label:'Coef. deforestación',data:[-2.168,-13.72,-13.51,-10.31],
   backgroundColor:['#9fb7ad','#1f6f54','#2e8b6a','#6fae97']}]},
 options:{plugins:{legend:{display:false},tooltip:{callbacks:{afterLabel:(c)=>['','M2/M3 p<0.001','','M4 p<0.05'][c.dataIndex]}}},
  scales:{y:{title:{display:true,text:'Coeficiente'}}}}});
const c2=new Chart(document.getElementById('c2'),{
 data:{labels:['-25%','-67%','-100%'],
  datasets:[
   {type:'bar',label:'Energía adicional (Mkwh)',data:[33,82,132],backgroundColor:'#2e8b6a',yAxisID:'y'},
   {type:'line',label:'Valor (miles de millones COP)',data:[4,9,15],borderColor:'#2e5496',backgroundColor:'#2e5496',yAxisID:'y1',tension:.2}
  ]},
 options:{scales:{y:{position:'left',title:{display:true,text:'Mkwh'}},y1:{position:'right',grid:{drawOnChartArea:false},title:{display:true,text:'mil mill. COP'}}}}});
setLang('es');
</script>
</body>
</html>
